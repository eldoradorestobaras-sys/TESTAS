name: Build Model MI Kasa APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile_app/**"
      - ".github/workflows/build_apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Capacitor & Add Android
        working-directory: mobile_app
        run: |
          npm install
          npx cap add android
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)
              open(p, "w").write(s)
          '
          npx cap sync android

      - name: Build Debug APK
        working-directory: mobile_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Model-MI-Kasa.apk
        uses: actions/upload-artifact@v4
        with:
          name: Model-MI-Kasa-APK
          path: mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
