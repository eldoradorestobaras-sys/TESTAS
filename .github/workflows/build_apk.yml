name: Build Model MI Kasa APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile_app/**"
      - ".github/workflows/build_apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Capacitor & Add Android
        working-directory: mobile_app
        run: |
          npm install
          npx cap add android
          python3 -m venv /tmp/pv && /tmp/pv/bin/pip install -q pillow
          /tmp/pv/bin/python3 -c '
          import os
          from PIL import Image
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "usesCleartextTraffic" not in s:
              s = s.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)
              open(p, "w").write(s)
          res_dir = "android/app/src/main/res"
          bg_xml = os.path.join(res_dir, "values", "ic_launcher_background.xml")
          os.makedirs(os.path.dirname(bg_xml), exist_ok=True)
          open(bg_xml, "w").write("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#0B0D12</color>\n</resources>\n")
          src_icon = "www/icon-512.png" if os.path.exists("www/icon-512.png") else "www/icon.png"
          if os.path.exists(src_icon):
              im = Image.open(src_icon).convert("RGBA")
              bbox = im.getbbox()
              if bbox:
                  im = im.crop(bbox)
              for root, _, files in os.walk(res_dir):
                  for fn in files:
                      if fn not in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                          continue
                      fp = os.path.join(root, fn)
                      try:
                          tw, th = Image.open(fp).size
                      except Exception:
                          tw, th = (512, 512)
                      if fn == "ic_launcher_foreground.png":
                          canvas = Image.new("RGBA", (tw, th), (0, 0, 0, 0))
                          scale = int(min(tw, th) * 0.72)
                          resized = im.resize((scale, scale), Image.LANCZOS)
                          canvas.paste(resized, ((tw - scale) // 2, (th - scale) // 2), resized)
                          canvas.save(fp)
                      else:
                          canvas = Image.new("RGBA", (tw, th), (11, 13, 18, 255))
                          resized = im.resize((tw, th), Image.LANCZOS)
                          canvas.paste(resized, (0, 0), resized)
                          canvas.save(fp)
          '
          npx cap sync android

      - name: Build Debug APK
        working-directory: mobile_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Model-MI-Kasa.apk
        uses: actions/upload-artifact@v5
        with:
          name: Model-MI-Kasa-APK
          path: mobile_app/android/app/build/outputs/apk/debug/app-debug.apk
